<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Sound Generator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background: linear-gradient(135deg, #151821, #292f42);
    color: white;
}

.panel {
    width: 620px;
    padding: 20px 28px;

    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 18px;

    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
}

h1 {
    margin: 0 0 15px 0;
    text-align: center;
    font-size: 24px;
}


/* =========================
   ВИЗУАЛИЗАТОР
========================= */

.visualizer {
    height: 80px;

    margin-bottom: 15px;

    background: rgba(0,0,0,0.25);

    border-radius: 12px;

    overflow: hidden;
}

#visualizer {
    width: 100%;
    height: 100%;
    display: block;
}


/* =========================
   КОНТРОЛЫ
========================= */

.control {
    margin-top: 15px;
}

.label {
    display: flex;
    justify-content: space-between;

    margin-bottom: 7px;

    font-size: 16px;
}

.number {
    font-weight: bold;
}


/* =========================
   ПОЛЗУНОК
========================= */

input[type="range"] {
    width: 100%;
    height: 7px;

    appearance: none;
    -webkit-appearance: none;

    background: #454c61;
    border-radius: 10px;

    outline: none;
}

input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: white;

    cursor: pointer;

    box-shadow: 0 0 12px rgba(70,150,255,0.8);
}

input[type="range"]::-moz-range-thumb {
    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: white;

    border: none;

    cursor: pointer;
}


/* =========================
   КНОПКИ ЗВУКОВ
========================= */

.sound-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    margin-top: 8px;
}

.sound-button {
    padding: 10px;

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 9px;

    background: rgba(255,255,255,0.07);

    color: white;

    font-size: 14px;

    cursor: pointer;
}

.sound-button:hover {
    background: rgba(255,255,255,0.14);
}

.sound-button.active {
    background: #3d8bfd;

    border-color: #65a6ff;

    box-shadow: 0 0 12px rgba(61,139,253,0.35);
}


/* =========================
   НИЖНЯЯ ПАНЕЛЬ
========================= */

.bottom {
    display: flex;
    align-items: center;
    gap: 12px;

    margin-top: 15px;
}

.frequency-display {
    flex: 1;

    font-size: 26px;
    font-weight: bold;
}

#playButton {
    padding: 10px 25px;

    border: none;

    border-radius: 9px;

    background: #3d8bfd;

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

#playButton:hover {
    background: #5a9cff;
}

.hint {
    text-align: center;

    margin-top: 10px;

    color: #9299aa;

    font-size: 12px;
}

</style>
</head>


<body>

<div class="panel">

    <h1>🎵 Sound Generator</h1>


    <!-- Визуализация -->

    <div class="visualizer">

        <canvas id="visualizer"></canvas>

    </div>


    <!-- Частота -->

    <div class="control">

        <div class="label">

            <span>Частота</span>

            <span class="number" id="frequencyText">
                20 Гц
            </span>

        </div>

        <input
            type="range"
            id="frequency"
            min="2"
            max="45"
            value="20"
        >

    </div>


    <!-- Громкость -->

    <div class="control">

        <div class="label">

            <span>Громкость</span>

            <span class="number" id="volumeText">
                80%
            </span>

        </div>

        <input
            type="range"
            id="volume"
            min="0"
            max="100"
            value="80"
        >

    </div>


    <!-- Выбор звука -->

    <div class="control">

        <div class="label">

            <span>Звук</span>

        </div>


        <div class="sound-buttons">

            <button
                class="sound-button active"
                data-sound="drum">
                🥁 Барабан
            </button>

            <button
                class="sound-button"
                data-sound="beep">
                📢 Пищалка
            </button>

            <button
                class="sound-button"
                data-sound="bird">
                🐦 Воробей
            </button>

        </div>

    </div>


    <!-- Нижняя панель -->

    <div class="bottom">

        <div
            class="frequency-display"
            id="display">
            20 Гц
        </div>

        <button id="playButton">
            ▶ Старт
        </button>

    </div>


    <div class="hint">
        Можно нажать на ползунок частоты для запуска
    </div>

</div>


<script>

/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const frequencySlider =
    document.getElementById("frequency");

const volumeSlider =
    document.getElementById("volume");

const frequencyText =
    document.getElementById("frequencyText");

const volumeText =
    document.getElementById("volumeText");

const display =
    document.getElementById("display");

const playButton =
    document.getElementById("playButton");

const soundButtons =
    document.querySelectorAll(".sound-button");

const canvas =
    document.getElementById("visualizer");

const ctx =
    canvas.getContext("2d");


/* =====================================================
   СОСТОЯНИЕ
===================================================== */

let audioContext = null;

let timer = null;

let playing = false;

let selectedSound = "drum";

let animationFrame = null;

let startTime = 0;


/* =====================================================
   AUDIO
===================================================== */

function getAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (audioContext.state === "suspended") {

        audioContext.resume();

    }

    return audioContext;
}


/* =====================================================
   БАРАБАН
===================================================== */

function playDrum() {

    const audio = getAudio();

    const now = audio.currentTime;

    const volume =
        Number(volumeSlider.value) / 100;


    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();


    oscillator.type = "sine";


    oscillator.frequency.setValueAtTime(
        150,
        now
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        45,
        now + 0.12
    );


    gain.gain.setValueAtTime(
        0.9 * volume,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.15
    );


    oscillator.connect(gain);

    gain.connect(audio.destination);


    oscillator.start(now);

    oscillator.stop(now + 0.16);


    /* Шум барабана */

    const bufferSize =
        Math.floor(audio.sampleRate * 0.06);


    const buffer =
        audio.createBuffer(
            1,
            bufferSize,
            audio.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    for (let i = 0; i < bufferSize; i++) {

        data[i] =
            Math.random() * 2 - 1;

    }


    const noise =
        audio.createBufferSource();

    const noiseGain =
        audio.createGain();


    noise.buffer = buffer;


    noiseGain.gain.setValueAtTime(
        0.3 * volume,
        now
    );


    noiseGain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.06
    );


    noise.connect(noiseGain);

    noiseGain.connect(audio.destination);


    noise.start(now);
}


/* =====================================================
   ПИЩАЛКА
===================================================== */

function playBeep() {

    const audio = getAudio();

    const now = audio.currentTime;

    const volume =
        Number(volumeSlider.value) / 100;


    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();


    oscillator.type = "square";


    oscillator.frequency.setValueAtTime(
        900,
        now
    );


    gain.gain.setValueAtTime(
        0.3 * volume,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.08
    );


    oscillator.connect(gain);

    gain.connect(audio.destination);


    oscillator.start(now);

    oscillator.stop(now + 0.09);
}


/* =====================================================
   ВОРОБЕЙ
===================================================== */

function playBird() {

    const audio = getAudio();

    const now = audio.currentTime;

    const volume =
        Number(volumeSlider.value) / 100;


    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();


    oscillator.type = "sine";


    oscillator.frequency.setValueAtTime(
        1800,
        now
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        3200,
        now + 0.04
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        1500,
        now + 0.10
    );


    gain.gain.setValueAtTime(
        0.4 * volume,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.12
    );


    oscillator.connect(gain);

    gain.connect(audio.destination);


    oscillator.start(now);

    oscillator.stop(now + 0.13);
}


/* =====================================================
   ВОСПРОИЗВЕДЕНИЕ
===================================================== */

function playSound() {

    if (selectedSound === "drum") {

        playDrum();

    }

    else if (selectedSound === "beep") {

        playBeep();

    }

    else if (selectedSound === "bird") {

        playBird();

    }

}


/* =====================================================
   ЗАПУСК
===================================================== */

function startSound() {

    getAudio();

    stopTimer();


    playing = true;

    startTime = performance.now();


    playSound();


    const frequency =
        Number(frequencySlider.value);


    const interval =
        1000 / frequency;


    timer =
        setInterval(
            playSound,
            interval
        );


    playButton.textContent =
        "■ Стоп";
}


/* =====================================================
   ОСТАНОВКА
===================================================== */

function stopTimer() {

    if (timer !== null) {

        clearInterval(timer);

        timer = null;

    }

}


/* =====================================================
   ПОЛНАЯ ОСТАНОВКА
===================================================== */

function stopSound() {

    stopTimer();

    playing = false;

    playButton.textContent =
        "▶ Старт";
}


/* =====================================================
   ИЗМЕНЕНИЕ ЧАСТОТЫ
===================================================== */

frequencySlider.addEventListener(
    "input",
    function() {

        const value =
            Number(this.value);


        frequencyText.textContent =
            value + " Гц";


        display.textContent =
            value + " Гц";


        /*
           Если уже играет,
           сразу меняем частоту
        */

        if (playing) {

            startSound();

        }

    }
);


/* =====================================================
   НАЖАТИЕ НА ПОЛЗУНОК
===================================================== */

frequencySlider.addEventListener(
    "pointerdown",
    function() {

        /*
           Нажатие запускает звук.
           Отпускание НЕ останавливает его.
        */

        if (!playing) {

            startSound();

        }

    }
);


/* =====================================================
   ГРОМКОСТЬ
===================================================== */

volumeSlider.addEventListener(
    "input",
    function() {

        volumeText.textContent =
            this.value + "%";

    }
);


/* =====================================================
   ВЫБОР ЗВУКА
===================================================== */

soundButtons.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                soundButtons.forEach(
                    function(b) {

                        b.classList.remove(
                            "active"
                        );

                    }
                );


                this.classList.add("active");


                selectedSound =
                    this.dataset.sound;


                /*
                   Если уже играет,
                   перезапускаем с новым звуком
                */

                if (playing) {

                    startSound();

                }

            }
        );

    }
);


/* =====================================================
   КНОПКА
===================================================== */

playButton.addEventListener(
    "click",
    function() {

        if (playing) {

            stopSound();

        }

        else {

            startSound();

        }

    }
);


/* =====================================================
   ВИЗУАЛИЗАЦИЯ
===================================================== */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    canvas.width =
        rect.width * window.devicePixelRatio;

    canvas.height =
        rect.height * window.devicePixelRatio;


    ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
    );

}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();


/*
   Здесь используется реальное время.

   Один полный цикл визуализации =
   один период частоты.

   Поэтому при 2 Гц будет 2 пульса
   в секунду, а при 45 Гц — 45.
*/

function drawVisualizer() {

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* Фон */

    ctx.fillStyle =
        "rgba(10, 15, 25, 0.35)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    if (playing) {

        const frequency =
            Number(frequencySlider.value);


        const elapsed =
            (performance.now() - startTime)
            / 1000;


        /*
           Фаза меняется с той же частотой,
           что и звук.
        */

        const phase =
            (elapsed * frequency) % 1;


        /*
           Пульс:
           0 → 1 → 0
        */

        const pulse =
            (Math.sin(
                phase * Math.PI * 2
            ) + 1) / 2;


        /* Центральная линия */

        ctx.beginPath();

        ctx.moveTo(
            0,
            height / 2
        );

        ctx.lineTo(
            width,
            height / 2
        );

        ctx.strokeStyle =
            "rgba(255,255,255,0.12)";

        ctx.lineWidth = 1;

        ctx.stroke();


        /*
           Волна.
           Количество волн визуально зависит
           от выбранной частоты.
        */

        ctx.beginPath();


        for (
            let x = 0;
            x <= width;
            x++
        ) {

            const cycles =
                2 + frequency / 5;


            const y =
                height / 2
                +
                Math.sin(
                    (x / width) *
                    Math.PI * 2 *
                    cycles
                    -
                    phase * Math.PI * 2
                )
                *
                (
                    10 +
                    pulse * 15
                );


            if (x === 0) {

                ctx.moveTo(x, y);

            }

            else {

                ctx.lineTo(x, y);

            }

        }


        ctx.strokeStyle =
            "#4da3ff";

        ctx.lineWidth = 2;

        ctx.stroke();


        /*
           Большой центральный пульс
        */

        const radius =
            8 + pulse * 16;


        ctx.beginPath();

        ctx.arc(
            width / 2,
            height / 2,
            radius,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "rgba(77,163,255," +
            (0.35 + pulse * 0.5) +
            ")";


        ctx.fill();

    }

    else {

        /*
           Когда остановлено —
           показываем спокойную линию.
        */

        ctx.beginPath();

        ctx.moveTo(
            0,
            height / 2
        );

        ctx.lineTo(
            width,
            height / 2
        );

        ctx.strokeStyle =
            "rgba(255,255,255,0.15)";

        ctx.lineWidth = 2;

        ctx.stroke();

    }


    animationFrame =
        requestAnimationFrame(
            drawVisualizer
        );

}


drawVisualizer();

</script>

</body>
</html>
